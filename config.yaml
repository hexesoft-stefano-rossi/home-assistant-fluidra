name: "Hexesoft Fluidra"
description: "Bridge Fluidra/AstralPool (Modbus TCP) in Home Assistant"
version: "1.1.3"
slug: "hexesoft_fluidra"
arch:
  - aarch64
  - amd64
host_network: true
startup: application
boot: auto

options:
  modbus:
    host: ""
    port: 502
    timeout_ms: 3000
    trace_hex_dump: false

  mqtt:
    host: "core-mosquitto"
    port: 1883
    username: ""
    password: ""
    base_topic: "pool_bridge"
    discovery_prefix: "homeassistant"

  poll_settings:
    interval_seconds: 30
    full_bus_scan: false
    scan_from: 1
    scan_to: 60

  system_settings:
    log_level: "info"

  # Ogni categoria è wrappata in `.devices` per rendere il form di HA più
  # leggibile: la sezione ha il titolo della categoria e la lista dei device
  # dentro (stesso stile del bridge BTicino).
  heat_pumps:
    devices: []
  valves:
    devices: []
  gpios:
    devices: []
  lights:
    devices: []
  chlorinators:
    devices: []
  generics:
    devices: []

schema:

  modbus:
    host: str
    port: int
    timeout_ms: int(500,60000)
    trace_hex_dump: bool?  # DIAGNOSTICA: stampa byte TX/RX in hex. Richiede log_level=debug.

  mqtt:
    host: str
    port: int
    username: str?
    password: password?
    base_topic: str
    discovery_prefix: str

  poll_settings:
    interval_seconds: int(10,3600)  # non scendere sotto 10 con molti dispositivi
    full_bus_scan: bool
    scan_from: int(1,247)
    scan_to: int(1,247)

  system_settings:
    log_level: list(info|debug|warning|error)

  # NB: HA add-on schema non permette di rendere OPZIONALE una lista/mappa annidata dentro un
  # elemento di lista. Le sotto-liste (relays, inputs, colors, mappings, measure_registers) sono
  # quindi dichiarate obbligatorie come chiave: quando aggiungi un dispositivo, aggiungi anche
  # le sotto-liste (basta lasciarle VUOTE se non ti servono). Ogni campo dentro le sotto-liste
  # è invece marcato `?` così puoi popolarle a pezzi.

  # Pompa di calore PROELYO INVERBOOST NN / ELYO SMART B NN.
  # Tutti i parametri tecnici (indirizzi registri, limiti temperatura, scala setpoint)
  # sono hardcoded nel driver: derivano dal reverse engineering del protocollo Modbus
  # e non sono conoscibili dall'utente. L'utente deve solo dire il name e l'unit_id.
  # enable_debug_probe: se true, ogni polling legge ~60 registri extra IR/HR non identificati
  # e li stampa nel log DEBUG. Utile per sessioni di diagnostica intensiva della PdC.
  heat_pumps:
    devices:
      - name: str
        unit_id: int(1,247)
        enabled: bool?
        enable_debug_probe: bool?

  # Valvola selettrice SVRAC 2 / SVRAC 3 (AstralPool).
  # Modello riconosciuto automaticamente dal SCAN. L'utente sceglie solo se abilitare
  # il comando di SCARICO — è disattivato di default per sicurezza (svuota la piscina).
  valves:
    devices:
      - name: str
        unit_id: int(1,247)
        enabled: bool?
        allow_drain: bool?          # ATTENZIONE: se true, lo SCARICO svuota la piscina
        enable_debug_probe: bool?   # DIAGNOSTICA: legge registri HR non documentati per reverse engineering

  # Modulo GPIO GP4I-4O (4 relè + 4 ingressi digitali).
  # Modello riconosciuto automaticamente. Il modulo ha SEMPRE 4 relè e 4 ingressi fisici:
  # ognuno di essi è uno SLOT FISSO (non una lista dinamica). L'utente attiva o disattiva
  # ciascuno col campo `enabled` e configura nome/tipo di quelli che ha cablato.
  # Vantaggio: la corrispondenza indice→hardware è garantita e non c'è il bug HA
  # "modifica un elemento della lista → ne aggiunge uno nuovo".
  gpios:
    devices:
      - name: str
        unit_id: int(1,247)
        enabled: bool?
        # 4 relè + 4 ingressi = 8 slot fissi. Ogni slot ha 3 campi opzionali (enabled,
        # name, type). Sono dichiarati PIATTI (non come oggetto nested) perché lo schema
        # HA add-on richiede obbligatoriamente tutti gli oggetti dichiarati — con questa
        # struttura invece gli slot non usati si possono lasciare completamente vuoti.
        relay_1_enabled: bool?
        relay_1_name: str?
        relay_1_type: list(Interruttore|Pompa|Elettrovalvola|Ventilatore|Riscaldatore|Presa elettrica|Luce|Faretti LED)?
        relay_2_enabled: bool?
        relay_2_name: str?
        relay_2_type: list(Interruttore|Pompa|Elettrovalvola|Ventilatore|Riscaldatore|Presa elettrica|Luce|Faretti LED)?
        relay_3_enabled: bool?
        relay_3_name: str?
        relay_3_type: list(Interruttore|Pompa|Elettrovalvola|Ventilatore|Riscaldatore|Presa elettrica|Luce|Faretti LED)?
        relay_4_enabled: bool?
        relay_4_name: str?
        relay_4_type: list(Interruttore|Pompa|Elettrovalvola|Ventilatore|Riscaldatore|Presa elettrica|Luce|Faretti LED)?
        input_1_enabled: bool?
        input_1_name: str?
        input_1_type: list(Contatto generico|Flussostato|Pressostato|Livello acqua|Movimento|Porta / finestra|Fumo|Contatore impulsi|Contatto + contatore)?
        input_2_enabled: bool?
        input_2_name: str?
        input_2_type: list(Contatto generico|Flussostato|Pressostato|Livello acqua|Movimento|Porta / finestra|Fumo|Contatore impulsi|Contatto + contatore)?
        input_3_enabled: bool?
        input_3_name: str?
        input_3_type: list(Contatto generico|Flussostato|Pressostato|Livello acqua|Movimento|Porta / finestra|Fumo|Contatore impulsi|Contatto + contatore)?
        input_4_enabled: bool?
        input_4_name: str?
        input_4_type: list(Contatto generico|Flussostato|Pressostato|Livello acqua|Movimento|Porta / finestra|Fumo|Contatore impulsi|Contatto + contatore)?

  # Modulo luci AstralPool LumiPlus Modbus.
  # Modello riconosciuto automaticamente. I 12 colori standard e le 8 sequenze del
  # manuale LumiPlus sono hardcoded nel driver: l'utente non li deve dichiarare.
  lights:
    devices:
      - name: str
        unit_id: int(1,247)
        enabled: bool?

  # Centraline chimica Energy Connect (Tecno LC2): pH, ORP, cloro, sale, temperatura, elettrolisi.
  # Modello riconosciuto automaticamente. Nessun parametro utente: tutte le entità sono fisse.
  chlorinators:
    devices:
      - name: str
        unit_id: int(1,247)
        enabled: bool?

  generics:
    devices:
      - name: str
        unit_id: int(1,247)
        enabled: bool?
        model: str?
        prefix: str
        mappings:
          - name: str
            area: list(holding|input|coil|discrete)
            address: int(0,65535)
            kind: list(sensor|binary_sensor|switch|number|select|light)
            scale: float?
            signed: bool?
            unit: str?
            device_class: str?
            icon: str?
            bit: int(-1,15)?
            writable: bool?
            min: float?
            max: float?
            step: float?
            diagnostic: bool?
